name: Check public distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft.wasm.click
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: minecraft.wasm.click
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: relay
          path: relay
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Use runner JDK for source behavior tests
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix runtime
      - run: npm run check
      - name: Check a fresh Docker install
        run: |
          docker compose up --build --wait
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/ | grep 'IMPORT ACCOUNT JSON'
      - name: Stop containers
        if: always()
        run: docker compose down
